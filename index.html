<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>句子题网站已升级</title>
  <style>
    :root{
      --bg:#f5f2eb;
      --card:#fffdf8;
      --ink:#183b37;
      --muted:#687572;
      --line:#ddd7ca;
      --teal:#1f655e;
      --teal-dark:#164d47;
      --mist:#e6f1ee;
      --clay:#b4773e;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      padding:28px 18px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 15% 15%,rgba(31,101,94,.10),transparent 28rem),
        radial-gradient(circle at 90% 85%,rgba(180,119,62,.10),transparent 24rem),
        var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
    }
    .card{
      width:min(680px,100%);
      padding:clamp(30px,6vw,58px);
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,253,248,.96);
      box-shadow:0 18px 55px rgba(35,55,51,.10);
      text-align:center;
    }
    .eyebrow{
      display:inline-block;
      margin-bottom:18px;
      padding:7px 12px;
      border-radius:999px;
      background:var(--mist);
      color:var(--teal);
      font-size:12px;
      font-weight:800;
      letter-spacing:.12em;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman","Noto Serif SC",serif;
      font-size:clamp(30px,7vw,48px);
      line-height:1.18;
      letter-spacing:-.02em;
    }
    .lead{
      margin:22px auto 0;
      max-width:520px;
      color:var(--muted);
      font-size:16px;
      line-height:1.85;
    }
    .notice{
      margin:24px 0;
      padding:15px 16px;
      border:1px solid #cfe2de;
      border-radius:13px;
      background:#f0f7f5;
      color:var(--teal-dark);
      font-size:14px;
      line-height:1.75;
      text-align:left;
    }
    .button{
      display:block;
      width:100%;
      padding:15px 20px;
      border-radius:12px;
      background:var(--teal-dark);
      color:#fff;
      font-size:17px;
      font-weight:800;
      text-decoration:none;
      box-shadow:0 8px 22px rgba(22,77,71,.20);
      transition:transform .15s ease,background .15s ease;
    }
    .button:hover{background:var(--teal);transform:translateY(-1px)}
    .button:focus-visible{outline:3px solid rgba(180,119,62,.45);outline-offset:4px}
    .countdown{
      min-height:24px;
      margin:14px 0 0;
      color:var(--muted);
      font-size:13px;
    }
    .foot{
      margin-top:26px;
      padding-top:20px;
      border-top:1px solid var(--line);
      color:#89918f;
      font-size:12px;
      line-height:1.7;
    }
    @media (prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="eyebrow">WEBSITE UPGRADE · 网站升级</div>
    <h1 id="page-title">旧版句子题网站<br>已停止使用</h1>
    <p class="lead">
      题库和学习功能已经迁移到新版网站。旧版不再开放做题，请前往新版继续学习。
    </p>
    <div class="notice">
      <strong>原有记录不会因关闭旧网页而被删除。</strong><br>
      使用原邮箱登录新版后，可继续使用已经保存在云端的学习记录。
    </div>
    <a class="button" id="new-site-link" href="https://artemis629.github.io/sentence-review-pro/">
      进入新版句子题网站 →
    </a>
    <p class="countdown" id="countdown" aria-live="polite">8 秒后自动前往新版网站</p>
    <p class="foot">
      本页面只用于新旧网站过渡，不再提供答题、复习或题库浏览功能。
    </p>
  </main>
  <script>
    // 只负责跳转；不清除 localStorage，也不修改任何 Supabase 学习记录。
    const NEW_SITE_URL = "https://artemis629.github.io/sentence-review-pro/";
    const countdown = document.getElementById("countdown");
    let seconds = 8;
    const timer = window.setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) {
        window.clearInterval(timer);
        countdown.textContent = "正在前往新版网站……";
        window.location.replace(NEW_SITE_URL);
        return;
      }
      countdown.textContent = `${seconds} 秒后自动前往新版网站`;
    }, 1000);
  </script>
</body>
</html>
